name: lighting-equipment-go

services:
  # Minio: S3-хранилище фото и видео светильников
  minio:
    image: quay.io/minio/minio:latest
    container_name: lighting-equipment-go-minio
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # веб-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5

  # Одноразовый контейнер: создаёт бакет "lighting-equipment", открывает его
  # на чтение и загружает в него файлы из папки assets/
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: lighting-equipment-go-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./assets:/assets:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/lighting-equipment &&
      mc anonymous set download local/lighting-equipment &&
      mc cp --recursive /assets/ local/lighting-equipment/ &&
      exit 0
      "

  # PostgreSQL: хранилище светильников, проектировщиков и лайков
  postgres:
    image: postgres:16-alpine
    container_name: lighting-equipment-go-db
    ports:
      - '5455:5432' # 5432 и 5433 заняты другими проектами
    environment:
      POSTGRES_USER: lighting
      POSTGRES_PASSWORD: lighting
      POSTGRES_DB: lighting_equipment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lighting -d lighting_equipment']
      interval: 5s
      timeout: 5s
      retries: 5

  # Adminer: веб-панель администратора БД, через неё наполняются таблицы
  adminer:
    image: adminer:latest
    container_name: lighting-equipment-go-adminer
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha

  # Redis: чёрный список JWT вышедших проектировщиков (logout).
  # appendonly — список переживает перезапуск контейнера
  redis:
    image: redis:7-alpine
    container_name: lighting-equipment-go-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  postgres-data:
  redis-data:
