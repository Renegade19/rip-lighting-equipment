<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Title}} — LumiCalc</title>
  <link rel="stylesheet" href="/css/lighting-equipment.css" />
</head>
<body class="page page--draft">
  <div class="screen screen--draft">
    <div class="draft-form">
      <!-- Сверху — изображение и видео, двумя отдельными блоками друг под другом.
           В этой лабораторной поля можно заполнять, но они не сохраняются. -->
      <div class="draft-media">
        <span class="draft-media__title">Изображение</span>
        <div class="draft-media__box">
          {{if .Draft.ImageURL}}
            <img src="{{.Draft.ImageURL}}" alt="{{.Draft.EquipmentName}}" />
          {{else}}
            <svg viewBox="0 0 22 22" class="draft-media__icon" fill="none">
              <rect x="0.75" y="0.75" width="20.5" height="20.5" rx="2.25" stroke="#F66300" stroke-width="1.5"/>
              <circle cx="6.25" cy="6.25" r="1.75" fill="#F66300"/>
              <path d="M3 17L8.5 10L12.5 14.5L15.5 11L19 17H3Z" stroke="#F66300" stroke-width="1.3"/>
            </svg>
            <span class="draft-media__hint">Изображение не выбрано</span>
          {{end}}
        </div>
        <input class="draft-media__file" type="file" id="imageFile" name="imageFile" accept="image/*" />
      </div>

      <div class="draft-media">
        <span class="draft-media__title">Видео</span>
        <div class="draft-media__box">
          {{if .Draft.VideoURL}}
            <video src="{{.Draft.VideoURL}}" muted playsinline></video>
          {{else}}
            <svg viewBox="0 0 24 24" class="draft-media__icon" fill="none">
              <rect x="1.75" y="4.75" width="14.5" height="14.5" rx="2.25" stroke="#F66300" stroke-width="1.5"/>
              <path d="M16.5 10.5L22 7V17L16.5 13.5V10.5Z" stroke="#F66300" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span class="draft-media__hint">Видео не выбрано</span>
          {{end}}
        </div>
        <input class="draft-media__file" type="file" id="videoFile" name="videoFile" accept="video/*" />
      </div>

      <!-- Ниже — текст и два поля по теме -->
      <div class="draft-form__fields">
        <div class="draft-form__field">
          <label class="draft-form__label" for="equipmentName">Название</label>
          <input class="draft-form__input" type="text" id="equipmentName" name="equipmentName" value="{{.Draft.EquipmentName}}" />
        </div>

        <div class="draft-form__field">
          <label class="draft-form__label" for="shortDescription">Краткое описание</label>
          <textarea class="draft-form__input draft-form__input--area" id="shortDescription" name="shortDescription" rows="3">{{.Draft.ShortDescription}}</textarea>
        </div>

        <div class="draft-form__field">
          <label class="draft-form__label" for="powerWatt">Мощность, Вт</label>
          <input class="draft-form__input" type="number" step="0.1" min="0" id="powerWatt" name="powerWatt" value="{{.Draft.PowerWatt}}" />
        </div>

        <div class="draft-form__field">
          <label class="draft-form__label" for="beamAngleDeg">Угол рассеивания, °</label>
          <input class="draft-form__input" type="number" step="1" min="0" max="360" id="beamAngleDeg" name="beamAngleDeg" value="{{.Draft.BeamAngleDeg}}" />
        </div>
      </div>
    </div>

    {{template "lighting-equipment-tabbar" .}}
  </div>
</body>
</html>
